upstream frontend_upstream { server frontend:5173; }
upstream auth_upstream     { server auth-service:3001; }
upstream empl_upstream     { server employee-service:3002; }
upstream recr_upstream     { server recruitment-service:3003; }
upstream att_upstream      { server attendance-service:3004; }
upstream comp_upstream     { server compensation-service:3005; }
upstream perf_upstream     { server performance-service:3006; }
upstream notf_upstream     { server notification-service:3007; }

limit_req_zone $binary_remote_addr zone=quejas_consulta:1m rate=10r/m;

server {
    listen 80;

    # Límite global para este servidor
    client_max_body_size 25M;

    # Headers generales
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend
    location /api/auth/ {
        proxy_pass http://auth_upstream/;
    }

    location /api/empl/ {
        proxy_pass http://empl_upstream/;
    }

    location /api/recr/ {
        proxy_pass http://recr_upstream/;
    }

    location /api/att/ {
        proxy_pass http://att_upstream/;
    }

    location /api/comp/ {
        proxy_pass http://comp_upstream/;
    }

    location /api/perf/ {
        proxy_pass http://perf_upstream/;
    }

    # RF-68: el buzón de quejas no deja rastro del cliente (sin logs ni IP, user-agent o referer hacia el servicio).
    location /api/perf/quejas {
        access_log off;
        error_log /dev/null;
        proxy_pass http://perf_upstream/quejas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";
    }

    # RF-68: la consulta por código es pública; se limita por IP contra la fuerza bruta y solo se reenvía la IP real.
    location /api/perf/quejas/seguimiento {
        access_log off;
        error_log /dev/null;
        limit_req zone=quejas_consulta burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @quejas_demasiados_intentos;
        proxy_pass http://perf_upstream/quejas/seguimiento;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";
    }

    location @quejas_demasiados_intentos {
        access_log off;
        default_type application/json;
        return 429 '{"error":"Demasiados intentos de consulta. Espere un momento e intente nuevamente."}';
    }

    location /api/notf/ {
        proxy_pass http://notf_upstream/;
    }

    # RF-15: los correos de entrevista solo los pide RecruitmentService por la red interna (notification-service:3007).
    location /api/notf/correos/ {
        default_type application/json;
        return 404 '{"error":"Ruta no encontrada."}';
    }
}