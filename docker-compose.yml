services:
  # BD
  postgres:
    image: postgres:16-alpine
    container_name: rrhh-postgres
    restart: unless-stopped
    env_file:
      - ./database/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-all.sh:/docker-entrypoint-initdb.d/init-all.sh:ro
      - ./backend/AuthService/db/init.sql:/init-scripts/auth/init.sql:ro
      - ./backend/EmployeeService/db/init.sql:/init-scripts/employee/init.sql:ro
      - ./backend/RecruitmentService/db/init.sql:/init-scripts/recruitment/init.sql:ro
      - ./backend/AttendanceService/db/init.sql:/init-scripts/attendance/init.sql:ro
      - ./backend/CompensationService/db/init.sql:/init-scripts/compensation/init.sql:ro
      - ./backend/PerformanceService/db/init.sql:/init-scripts/performance/init.sql:ro
      - ./backend/PerformanceService/db/catalogos.sql:/init-scripts/performance/catalogos.sql:ro
      - ./backend/NotificationService/db/init.sql:/init-scripts/notification/init.sql:ro
    networks:
      - rrhh-network

  # Emulador local de Pub/Sub (KAN-67 y similares): sin credenciales reales de GCP, CompensationService no
  # puede publicar ni suscribirse de verdad. El emulador deja probar el envío real (y las suscripciones que
  # dependan de otro módulo real, como Contabilidad o Pagos, se simulan desde la pantalla en vez de esperarlas
  # aquí). No usar en producción. Tópico propio de RRHH (ucb-sis323-sub-f) se crea solo al arrancar
  # CompensationService; para los demás, ver scripts/configurar-pubsub-emulador.sh.
  pubsub-emulator:
    image: google/cloud-sdk:emulators
    container_name: pubsub-emulator
    restart: unless-stopped
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=project-a96e5fe1-5ba6-4698-a85
    ports:
      - "8085:8085"
    networks:
      - rrhh-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rrhh-frontend
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rrhh-network

  # API Gateway
  nginx-gateway:
    image: nginx:alpine
    container_name: rrhh-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth-service
      - employee-service
      - recruitment-service
      - attendance-service
      - compensation-service
      - performance-service
      - notification-service
    networks:
      - rrhh-network

  # AuthService
  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile.dev
    container_name: auth-service
    env_file:
      - ./backend/AuthService/.env
    volumes:
      - ./backend/AuthService:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - rrhh-network

  # EmployeeService
  employee-service:
    build:
      context: ./backend/EmployeeService
      dockerfile: Dockerfile.dev
    container_name: employee-service
    env_file:
      - ./backend/EmployeeService/.env
    volumes:
      - ./backend/EmployeeService:/app
      - /app/node_modules
      - ./credentials:/credentials:ro
    depends_on:
      - postgres
    networks:
      - rrhh-network

  # RecruitmentService
  recruitment-service:
    build:
      context: ./backend/RecruitmentService
      dockerfile: Dockerfile.dev
    container_name: recruitment-service
    env_file:
      - ./backend/RecruitmentService/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/RecruitmentService:/app
      - /app/node_modules
      - ./credentials:/credentials:ro
    depends_on:
      - postgres
    networks:
      - rrhh-network

  # AttendanceService
  attendance-service:
    build:
      context: ./backend/AttendanceService
      dockerfile: Dockerfile.dev
    container_name: attendance-service
    env_file:
      - ./backend/AttendanceService/.env
    volumes:
      - ./backend/AttendanceService:/app
      - /app/node_modules
      - ./credentials:/credentials:ro
    depends_on:
      - postgres
    networks:
      - rrhh-network

  # CompensationService
  compensation-service:
    build:
      context: ./backend/CompensationService
      dockerfile: Dockerfile.dev
    container_name: compensation-service
    env_file:
      - ./backend/CompensationService/.env
    volumes:
      - ./backend/CompensationService:/app
      - /app/node_modules
      - ./credentials:/credentials:ro
    depends_on:
      - postgres
      - pubsub-emulator
    networks:
      - rrhh-network

  # PerformanceService
  performance-service:
    build:
      context: ./backend/PerformanceService
      dockerfile: Dockerfile.dev
    container_name: performance-service
    env_file:
      - ./backend/PerformanceService/.env
    volumes:
      - ./backend/PerformanceService:/app
      - /app/node_modules
      - quejas_adjuntos:/app/uploads/quejas
      - ./credentials:/credentials:ro
    depends_on:
      - postgres
    networks:
      - rrhh-network

  # NotificationService
  notification-service:
    build:
      context: ./backend/NotificationService
      dockerfile: Dockerfile.dev
    container_name: notification-service
    env_file:
      - ./backend/NotificationService/.env
    volumes:
      - ./backend/NotificationService:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - rrhh-network

volumes:
  postgres_data:
  quejas_adjuntos:

networks:
  rrhh-network:
    driver: bridge